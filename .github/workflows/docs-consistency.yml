name: Documentation Consistency Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build doccheck tool
      run: |
        cd tools/doccheck
        go build -o doccheck .

    - name: Run documentation consistency check
      id: check-docs
      run: |
        echo "Starting documentation consistency check..."
        ./tools/doccheck/doccheck --project-root . --strict --output docs_consistency_report.md

    - name: Upload consistency report
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: docs-consistency-report
        path: docs_consistency_report.md

    - name: Create issue for documentation issues
      if: failure() && github.event_name == 'schedule'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let report = '';
          try {
            report = fs.readFileSync('docs_consistency_report.md', 'utf8');
          } catch(e) {
            report = 'Report generation failed';
          }

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Documentation Consistency Check Issues Found',
            body: 'Documentation consistency issues found. Please update relevant documentation.\n\n' + report + '\n\n**Check Time**: ' + new Date().toISOString() + '\n**Trigger**: Scheduled',
            labels: ['documentation', 'consistency', 'automated']
          });

    - name: Comment on PR with issues
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          let report = '';
          try {
            report = fs.readFileSync('docs_consistency_report.md', 'utf8');
          } catch(e) {
            report = 'Report generation failed';
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: 'Documentation consistency issues found. Please update relevant documentation.\n\n' + report + '\n\n**Note**: High priority issues must be resolved before merging.',
          });
