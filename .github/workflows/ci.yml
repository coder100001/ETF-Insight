name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feat-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================
  # 后端 CI/CD
  # ============================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Go mod tidy
        working-directory: backend
        run: go mod tidy

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Go fmt check
        working-directory: backend
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files need formatting. Run 'gofmt -w .' to fix."
            gofmt -d .
            exit 1
          fi

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Build
        working-directory: backend
        run: go build -v ./...

      - name: Run tests with coverage
        working-directory: backend
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | grep total | awk '{print "Total coverage: " $3}'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Check coverage threshold
        working-directory: backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 50.0" | bc -l) )); then
            echo "Warning: Coverage $COVERAGE% is below 50% threshold"
          fi

  # ============================================
  # 前端 CI/CD
  # ============================================
  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint check
        working-directory: frontend
        run: npm run lint

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ============================================
  # Docker 构建（仅在 main 分支）
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: etf-insight:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm etf-insight:latest ./main --help || true

  # ============================================
  # 代码质量检查
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          echo "Checking for large files..."
          find . -type f -size +1M -not -path "*/node_modules/*" -not -path "*/.git/*" || true

      - name: Check for TODO comments
        run: |
          echo "Checking for TODO comments..."
          grep -r "TODO" --include="*.go" --include="*.ts" --include="*.tsx" . || true

  # ============================================
  # 测试报告汇总
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Backend Test Status
        run: |
          if [ "${{ needs.backend.result }}" == "success" ]; then
            echo "✅ Backend tests passed"
          else
            echo "❌ Backend tests failed"
          fi

      - name: Frontend Test Status
        run: |
          if [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ Frontend tests passed"
          else
            echo "❌ Frontend tests failed"
          fi
